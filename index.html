<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="资产盘点">
    <meta name="theme-color" content="#4A90D9">
    <link rel="manifest" href="manifest.json">
    <title>资产盘点</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">

        <!-- ========== 首页 ========== -->
        <div class="page page-home active" id="page-home">
            <div class="header">
                <div class="header-date">
                    <span id="currentMonth"></span>
                    <span class="header-icons">
                        <span class="eye-toggle" id="eyeToggle" onclick="toggleAmountVisible()" title="切换金额显示">👁️</span>
                        <span class="sync-indicator" id="syncIndicator" onclick="openSyncModal()">☁️</span>
                    </span>
                </div>
                <div class="header-subtitle">资产盘点 · 每月一次</div>
            </div>

            <div class="asset-overview" id="assetOverview"></div>

            <div class="section-title">
                <span>我的账户</span>
                <span class="section-action" onclick="openCheckinModal()">+ 批量盘点</span>
            </div>
            <div class="account-list" id="accountList"></div>

            <div class="section-title">
                <span>最近盘点</span>
            </div>
            <div class="record-list" id="recentRecords"></div>
        </div>

        <!-- ========== 统计页 ========== -->
        <div class="page page-stats" id="page-stats">
            <div class="nav-bar">
                <span class="nav-title">资产趋势</span>
            </div>
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="month" onclick="changeStatsMode('month')">按月</button>
                <button class="mode-tab" data-mode="year" onclick="changeStatsMode('year')">按年</button>
            </div>
            <div class="period-nav">
                <span class="month-nav-btn" onclick="changeStatsPeriod(-1)"><</span>
                <span id="statsPeriodLabel"></span>
                <span class="month-nav-btn" onclick="changeStatsPeriod(1)">></span>
            </div>
            <div class="stats-account-selector" id="statsAccountSelector"></div>
            <div class="chart-box">
                <div class="chart-title">📊 总资产趋势</div>
                <div class="chart-wrap">
                    <canvas id="totalAssetChart"></canvas>
                </div>
            </div>
            <div class="chart-box">
                <div class="chart-title">余额变化</div>
                <div class="chart-wrap">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
            <div class="stats-summary">
                <div class="stats-summary-item">
                    <span class="stats-summary-label">增长/减少</span>
                    <span class="stats-summary-value" id="statsGrowthAmount">--</span>
                </div>
                <div class="stats-summary-item">
                    <span class="stats-summary-label">变化率</span>
                    <span class="stats-summary-value" id="statsChangePercent">--</span>
                </div>
                <div class="stats-summary-item">
                    <span class="stats-summary-label">最高</span>
                    <span class="stats-summary-value" id="statsHighest">--</span>
                </div>
                <div class="stats-summary-item">
                    <span class="stats-summary-label">最低</span>
                    <span class="stats-summary-value" id="statsLowest">--</span>
                </div>
            </div>
            <div class="stats-detail-list" id="statsDetailList"></div>
        </div>

        <!-- ========== 设置页 ========== -->
        <div class="page page-settings" id="page-settings">
            <div class="nav-bar">
                <span class="nav-title">设置</span>
            </div>
            <div class="settings-group">
                <div class="settings-item" onclick="openAccountModal()">
                    <span class="settings-icon">🏦</span>
                    <span class="settings-label">账户管理</span>
                    <span class="settings-arrow">></span>
                </div>
                <div class="settings-item" onclick="openSyncModal()">
                    <span class="settings-icon">☁️</span>
                    <span class="settings-label">云端同步</span>
                    <span class="settings-value" id="syncStatusBadge">未配置</span>
                    <span class="settings-arrow">></span>
                </div>
            </div>
            <div class="settings-group">
                <div class="settings-item" onclick="exportData()">
                    <span class="settings-icon">📤</span>
                    <span class="settings-label">导出数据</span>
                    <span class="settings-arrow">></span>
                </div>
                <div class="settings-item" onclick="importData()">
                    <span class="settings-icon">📥</span>
                    <span class="settings-label">导入数据</span>
                    <span class="settings-arrow">></span>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
                </div>
            </div>
            <div class="settings-group">
                <div class="settings-item" onclick="clearAllData()">
                    <span class="settings-icon">🗑️</span>
                    <span class="settings-label danger">清空所有数据</span>
                    <span class="settings-arrow">></span>
                </div>
            </div>
            <div class="app-info">
                <p>资产盘点 v3.0.0</p>
                <p>每月一次，掌握资产变化</p>
            </div>
        </div>

        <!-- ========== 底部导航 ========== -->
        <div class="tab-bar">
            <div class="tab-item active" data-page="home" onclick="switchPage('home')">
                <span class="tab-icon">🏠</span>
                <span class="tab-label">首页</span>
            </div>
            <div class="tab-item" data-page="stats" onclick="switchPage('stats')">
                <span class="tab-icon">📊</span>
                <span class="tab-label">统计</span>
            </div>
            <div class="tab-item" data-page="settings" onclick="switchPage('settings')">
                <span class="tab-icon">⚙️</span>
                <span class="tab-label">设置</span>
            </div>
        </div>

        <!-- ========== 盘点弹窗 ========== -->
        <div class="modal-overlay" id="checkinModal">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="modal-close" onclick="closeCheckinModal()">✕</span>
                    <span class="modal-title" id="checkinModalTitle">资产盘点</span>
                    <span class="modal-save" onclick="saveCheckin()">保存</span>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <label class="form-label">盘点日期</label>
                        <input type="date" class="note-input" id="checkinDate">
                    </div>
                    <div class="form-row">
                        <label class="form-label">账户余额</label>
                        <div class="checkin-balances" id="checkinBalances"></div>
                    </div>
                    <div class="form-row">
                        <label class="form-label">备注</label>
                        <input type="text" class="note-input" id="checkinNote" placeholder="如：月底盘点" maxlength="50">
                    </div>
                    <input type="hidden" id="checkinRecordId">
                </div>
            </div>
        </div>

        <!-- ========== 账户管理弹窗 ========== -->
        <div class="modal-overlay" id="accountModal">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="modal-close" onclick="closeAccountModal()">✕</span>
                    <span class="modal-title">账户管理</span>
                    <span class="modal-save" onclick="saveAccount()">保存</span>
                </div>
                <div class="modal-body">
                    <div class="account-manage-list" id="accountManageList"></div>
                    <div class="add-account-row">
                        <input type="text" id="accountNameInput" placeholder="账户名称（如：支付宝）" maxlength="20">
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== 云端同步弹窗 ========== -->
        <div class="modal-overlay" id="syncModal">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="modal-close" onclick="closeSyncModal()">✕</span>
                    <span class="modal-title">云端同步设置</span>
                    <span class="modal-save" onclick="saveSyncConfigUI()">保存</span>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <label class="form-label">Supabase URL</label>
                        <input type="text" class="note-input" id="supabaseUrl" placeholder="https://xxxxx.supabase.co" autocomplete="off">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Anon Key</label>
                        <input type="text" class="note-input" id="supabaseKey" placeholder="eyJhbGciOi..." autocomplete="off">
                    </div>
                    <div class="form-row">
                        <label class="form-label">同步密钥（两台手机设置相同密钥）</label>
                        <input type="text" class="note-input" id="syncKey" placeholder="例如：family2024" maxlength="50" autocomplete="off">
                    </div>
                    <div class="sync-actions">
                        <button class="sync-btn" onclick="syncPush()">☁️ 上传到云端</button>
                        <button class="sync-btn" onclick="syncPull()">📥 从云端下载</button>
                    </div>
                    <div class="sync-actions">
                        <button class="sync-btn sync-btn-danger" onclick="syncForcePull()">🔄 以云端为准（覆盖本地）</button>
                    </div>
                    <p class="modal-hint">配置后，两台手机即可自动同步数据</p>
                </div>
            </div>
        </div>

        <!-- ========== Toast 提示 ========== -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
